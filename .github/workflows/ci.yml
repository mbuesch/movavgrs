name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

env: 
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and test
    strategy:
      matrix:
        toolchain:
          - name: msrv
            version: 1.61
          - name: stable
            version: stable
        os:
          - name: linux
            version: ubuntu-latest
          - name: windows
            version: windows-latest
          - name: macos
            version: macos-latest
    runs-on: ${{ matrix.os.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os.version }}-${{ matrix.toolchain.version }}
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os.version }}-${{ matrix.toolchain.version }}

      - run: rustup update ${{ matrix.toolchain.version }}
      - run: rustup default ${{ matrix.toolchain.version }}
      - if: matrix.toolchain.name == 'stable'
        run: rustup component add clippy
      - run: cargo build
      - if: matrix.toolchain.name == 'stable'
        run: cargo fmt --all --check
      - if: matrix.toolchain.name == 'stable'
        run: cargo clippy -- --deny warnings
      - if: matrix.toolchain.name == 'stable'
        run: cargo clippy --tests -- --deny warnings
      - run: cargo test
      - run: cargo test --features fastfloat
      - run: cargo test --tests --no-default-features
      - run: cargo test --tests --no-default-features --features fastfloat

